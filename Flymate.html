<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Flymate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: search bar → verdict with three numbers → flight tracker (dot map + progress) → reasons | flights → tabbed chart */
:root{
  --bg:#9cc1ec; --sky-a:#5d8fdc; --sky-b:#a8cbf0; --sky-c:#f3cfb6; --blob1:rgba(120,200,255,.75); --blob2:rgba(255,190,150,.7); --blob3:rgba(170,150,255,.45);
  --glass:rgba(255,255,255,.2); --glass-2:rgba(255,255,255,.28);
  --border:rgba(255,255,255,.5); --shadow:rgba(20,40,80,.12); --tip:rgba(255,255,255,.9);
  --ink:#0f1b2d; --ink-2:#2f4058; --ink-3:#4c5f78; --line:rgba(15,27,45,.12);
  --accent:#1a44c2; --accent-soft:rgba(26,68,194,.16); --on-accent:#ffffff;
  --bar:rgba(15,27,45,.22);
  --good:#12805a; --good-bg:rgba(18,128,90,.11);
  --warn:#a36600; --warn-bg:rgba(200,135,0,.14);
  --bad:#c8392d; --bad-bg:rgba(200,57,45,.1);
  --c-wx:#2f6fdb; --c-busy:#c27c0e; --c-late:#8b4fd6; --c-ops:#5d6b7e;
  /* tracker keeps one night-sky look in both themes */
  --trk-bg:rgba(8,13,30,.8); --trk-panel:rgba(255,255,255,.05); --trk-border:rgba(255,255,255,.1);
  --trk-ink:#eef3ff; --trk-ink-2:#8d9abb; --trk-dot:#7cc4ff;
  --trk-a:#38bdf8; --trk-b:#8b5cf6; --trk-c:#ec4899;
  --trk-good:#4fd1a0; --trk-warn:#fbbf4a; --trk-bad:#ff7a6e;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1226; --sky-a:#070d1d; --sky-b:#13244a; --sky-c:#3a2540; --blob1:rgba(60,110,230,.45); --blob2:rgba(230,120,90,.3); --blob3:rgba(140,90,230,.35);
  --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.14); --shadow:rgba(0,0,0,.3); --tip:rgba(16,26,48,.94);
  --ink:#eaf0f8; --ink-2:#9aabc0; --ink-3:#6f8197; --line:rgba(255,255,255,.08);
  --accent:#7ea3ff; --accent-soft:rgba(126,163,255,.14); --on-accent:#0b1220;
  --bar:rgba(255,255,255,.22);
  --good:#4fcb95; --good-bg:rgba(79,203,149,.13);
  --warn:#f0b44a; --warn-bg:rgba(240,180,74,.14);
  --bad:#ff7468; --bad-bg:rgba(255,116,104,.13);
  --trk-bg:rgba(6,10,24,.72);
  --c-wx:#6ea8ff; --c-busy:#f2b347; --c-late:#b98cff; --c-ops:#9aa8bb;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a1226; --sky-a:#070d1d; --sky-b:#13244a; --sky-c:#3a2540; --blob1:rgba(60,110,230,.45); --blob2:rgba(230,120,90,.3); --blob3:rgba(140,90,230,.35);
  --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.14); --shadow:rgba(0,0,0,.3); --tip:rgba(16,26,48,.94);
  --ink:#eaf0f8; --ink-2:#9aabc0; --ink-3:#6f8197; --line:rgba(255,255,255,.08);
  --accent:#7ea3ff; --accent-soft:rgba(126,163,255,.14); --on-accent:#0b1220;
  --bar:rgba(255,255,255,.22);
  --good:#4fcb95; --good-bg:rgba(79,203,149,.13);
  --warn:#f0b44a; --warn-bg:rgba(240,180,74,.14);
  --bad:#ff7468; --bad-bg:rgba(255,116,104,.13);
  --trk-bg:rgba(6,10,24,.72);
  --c-wx:#6ea8ff; --c-busy:#f2b347; --c-late:#b98cff; --c-ops:#9aa8bb;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(40vw 34vw at 8% 6%,var(--blob1),transparent 70%),radial-gradient(42vw 36vw at 96% 92%,var(--blob2),transparent 70%),radial-gradient(30vw 26vw at 70% 18%,var(--blob3),transparent 70%),linear-gradient(165deg,var(--sky-a) 0%,var(--sky-b) 55%,var(--sky-c) 100%)}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:22px 56px;display:flex;flex-direction:column;gap:18px}
@media (max-width:520px){.wrap{padding-inline:16px}}

.card{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--border);border-radius:20px;box-shadow:0 8px 32px var(--shadow),inset 0 1px 0 var(--border)}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand svg{width:22px;height:22px;fill:var(--accent);transform:rotate(45deg)}
.demo{font-size:12px;font-weight:600;color:var(--ink-2);padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--glass)}

/* ---------- search ---------- */
.search{position:relative;z-index:20;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;padding:14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 120px;position:relative}
.f.wide{flex:2 1 250px}
.f.seg-f{flex:2 1 260px}
.f > label,.f > .lab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-left:4px;transition:color .2s ease}
.f:focus-within > label,.f:focus-within > .lab{color:var(--accent)}
.ctl{font:inherit;font-weight:600;color:var(--ink);background:var(--glass-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;
  transition:border-color .2s ease,box-shadow .25s ease,background-color .2s ease,transform .2s var(--ease)}
.ctl:hover{background:var(--glass);border-color:var(--accent-soft)}
.ctl:focus,.ctl:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.pair{display:flex;align-items:center;gap:6px}
.pair .dd{flex:1 1 0;min-width:0}
.swap{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--glass-2);color:var(--ink-2);cursor:pointer;font-size:15px;transition:transform .45s var(--ease),background-color .2s}
.swap:hover{background:var(--glass)}
.swap.spin{transform:rotate(180deg)}
.price{position:relative}
.price span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:600;color:var(--ink-3);pointer-events:none}
.price input{padding-left:40px;padding-right:34px;-moz-appearance:textfield}
.price input::-webkit-outer-spin-button,.price input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.price .chev{position:absolute;right:14px;top:50%;margin-top:-5px;pointer-events:none}
.price-dd .dd-list{min-width:max(100%,230px)}
.price-dd .dd-list .pill{font-size:11px;padding:2px 8px}
.price-dd.open .ctl{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.price-dd .dd-head{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:6px 10px 4px;cursor:default}
.btn{font:inherit;font-weight:700;padding:0 22px;min-height:44px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;flex:0 0 auto;transition:transform .2s var(--ease),filter .2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
button:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
.err{color:var(--bad);font-weight:600;margin:0;padding:0 4px}

/* custom dropdown */
.dd{position:relative}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer}
.dd-btn .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn .v small{font-weight:500;color:var(--ink-3);margin-left:6px}
.chev{flex:none;width:10px;height:10px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:translateY(-2px) rotate(45deg);transition:transform .3s var(--ease)}
.dd.open .chev{transform:translateY(2px) rotate(225deg)}
.dd.open .dd-btn{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.dd-list{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:max(100%,210px);max-height:280px;overflow:auto;margin:0;padding:6px;list-style:none;
  background:var(--tip);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 40px var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  opacity:0;visibility:hidden;transform:translateY(-6px) scale(.97);transform-origin:top left;
  transition:opacity .18s ease,transform .26s var(--ease),visibility 0s linear .26s}
.dd-list{max-height:min(360px,60vh);scrollbar-width:none;-ms-overflow-style:none}
.dd-list::-webkit-scrollbar{display:none}
.dd.open .dd-list{opacity:1;visibility:visible;transform:none;transition:opacity .18s ease,transform .26s var(--ease),visibility 0s}
.dd-list li{display:flex;justify-content:space-between;gap:12px;padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:600;transition:background-color .15s ease,padding-left .2s var(--ease)}
.dd-list li small{color:var(--ink-3);font-weight:500}
.dd-list li.active{background:var(--accent-soft);padding-left:14px}
.dd-list li[aria-selected="true"]{color:var(--accent)}

/* calendar picker */
.dp .dd-btn .ico{flex:none;width:16px;height:16px;fill:none;stroke:var(--ink-3);stroke-width:2;margin-right:2px}
.dp .dd-btn .v{flex:1}
.cal{min-width:292px;max-height:none;overflow:visible;padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head b{font-weight:700}
.cal-nav{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;cursor:pointer;transition:background-color .2s ease,transform .2s var(--ease)}
.cal-nav:hover:not(:disabled){background:var(--accent-soft)}
.cal-nav:active:not(:disabled){transform:scale(.92)}
.cal-nav:disabled{opacity:.3;cursor:default}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-wd span{font-size:11px;font-weight:700;color:var(--ink-3);padding:4px 0}
.cal-grid button{height:36px;border:0;border-radius:9px;background:transparent;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums;
  transition:background-color .18s ease,color .18s ease,transform .2s var(--ease)}
.cal-grid button:hover:not(:disabled){background:var(--accent-soft);transform:scale(1.08)}
.cal-grid button.is-today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-grid button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);animation:pop .32s var(--ease)}
.cal-grid button:disabled{color:var(--ink-3);opacity:.35;cursor:default}
.cal-grid button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cal-grid.slide-l{animation:calL .32s var(--ease)}
.cal-grid.slide-r{animation:calR .32s var(--ease)}
@keyframes calL{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes calR{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

/* segmented time of day */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n,3),1fr);padding:4px;min-height:44px;border-radius:12px;background:var(--glass-2);border:1px solid var(--border)}
.seg-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,3));border-radius:9px;background:var(--accent);box-shadow:0 4px 14px var(--accent-soft);
  transform:translateX(calc(var(--i,0) * 100%));transition:transform .4s var(--ease)}
.seg button{position:relative;z-index:1;font:inherit;font-weight:600;font-size:14px;border:0;background:transparent;color:var(--ink-2);border-radius:9px;cursor:pointer;padding:0 6px;transition:color .3s ease}
.seg button[aria-checked="true"]{color:var(--on-accent)}

/* ---------- verdict ---------- */
.verdict{padding:26px 28px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr);gap:24px;align-items:center}
@media (max-width:820px){.verdict{grid-template-columns:minmax(0,1fr)}}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0}
.big{font-size:clamp(30px,4.4vw,42px);font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:6px 0 8px;color:var(--accent);text-wrap:balance}
.sub{margin:0;font-weight:600;color:var(--ink-2)}
.flight{margin-top:12px;font-family:var(--mono);font-size:13px;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.stats{grid-template-columns:minmax(0,1fr)}}
.stat{padding:16px;border-radius:16px;background:var(--glass-2);border:1px solid var(--border);min-width:0}
.num{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.num small{font-size:16px;font-weight:700;color:var(--ink-2);margin-right:2px}
.num.tone-good,.sub.tone-good{color:var(--good)} .num.tone-warn,.sub.tone-warn{color:var(--warn)} .num.tone-bad,.sub.tone-bad{color:var(--bad)}
.num[class*="tone-"] small{color:inherit}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:currentColor}
.stat .pill{white-space:normal;max-width:100%;line-height:1.3}
.stat .num{overflow:hidden;text-overflow:ellipsis}
.good{color:var(--good);background:var(--good-bg)}
.warn{color:var(--warn);background:var(--warn-bg)}
.bad{color:var(--bad);background:var(--bad-bg)}

/* ---------- tracker ---------- */
.trk{position:relative;border-radius:22px;overflow:hidden;background:var(--trk-bg);border:1px solid var(--trk-border);color:var(--trk-ink);
  -webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%);box-shadow:0 14px 40px var(--shadow)}
.trk-map{position:relative;height:320px}
@media (max-width:600px){.trk-map{height:270px}}
.trk-map canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.trk-chip{position:absolute;top:16px;left:16px;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--trk-panel);border:1px solid var(--trk-border);font-size:11px;font-weight:700;letter-spacing:.08em}
.trk-chip b{font-family:var(--mono);font-weight:500;letter-spacing:0;padding:3px 9px;border-radius:999px;background:linear-gradient(90deg,var(--trk-a),var(--trk-b));color:#fff}
.live{width:7px;height:7px;border-radius:50%;background:var(--trk-a);box-shadow:0 0 0 0 var(--trk-a);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(56,189,248,.6)}70%{box-shadow:0 0 0 8px rgba(56,189,248,0)}100%{box-shadow:0 0 0 0 rgba(56,189,248,0)}}
.trk-stats{position:absolute;top:16px;right:16px;display:flex;gap:8px}
.trk-stats div{padding:7px 12px;border-radius:10px;background:var(--trk-panel);border:1px solid var(--trk-border);min-width:84px}
.trk-stats span{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--trk-ink-2)}
.trk-stats b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:600px){.trk-stats{top:56px;left:16px;right:auto}.trk-stats div{min-width:0;padding:5px 9px}.trk-stats b{font-size:12px}}
.trk-label{position:absolute;padding:8px 12px;border-radius:10px;background:rgba(10,16,36,.75);border:1px solid var(--trk-border);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);white-space:nowrap;transition:left .5s var(--ease),top .5s var(--ease)}
.trk-label b{display:block;font-size:14px}
.trk-label span{font-size:12px;color:var(--trk-ink-2)}
.trk-plane{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;pointer-events:none}
.trk-plane svg{display:block;width:100%;height:100%;filter:drop-shadow(0 9px 6px rgba(0,0,0,.55)) drop-shadow(0 0 10px rgba(124,196,255,.25))}
@media (max-width:600px){.trk-plane{width:42px;height:42px;margin:-21px 0 0 -21px}}
.trk-bottom{display:flex;align-items:center;gap:22px;margin:0 14px 14px;padding:18px 22px;border-radius:18px;background:var(--trk-panel);border:1px solid var(--trk-border)}
@media (max-width:600px){.trk-bottom{gap:14px;padding:14px}}
.ring{position:relative;flex:none;width:84px;height:84px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:rgba(255,255,255,.1);stroke-width:6}
.ring .prog{fill:none;stroke:url(#ringGrad);stroke-width:6;stroke-linecap:round}
.ring .txt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .txt b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.ring .txt span{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--trk-ink-2)}
@media (max-width:600px){.ring{width:64px;height:64px}.ring .txt b{font-size:15px}}
.trk-prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.trk-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.km{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.km span{font-size:15px;font-weight:600;color:var(--trk-ink-2);letter-spacing:0}
.eta,.trk-row.small{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--trk-ink-2);text-transform:uppercase}
.trk-row.small span{font-family:var(--mono);font-weight:500;letter-spacing:.02em}
.scrub{position:relative;height:6px;border-radius:3px;margin:6px 0;background:rgba(255,255,255,.1)}
.scrub i{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);border-radius:3px;background:linear-gradient(90deg,var(--trk-a),var(--trk-b),var(--trk-c))}
.scrub i::after{content:"";position:absolute;right:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(139,92,246,.3),0 0 14px rgba(56,189,248,.7)}


/* ---------- reasons + options ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.panel{padding:20px 22px;min-width:0}
.panel h2{font-size:16px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.why-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.move{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-left:18px}
.move-t{font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.move-btn{flex:none;font:inherit;font-size:12px;font-weight:700;padding:5px 12px;min-height:30px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;transition:background-color .2s,color .2s,transform .2s var(--ease)}
.move-btn:hover{background:var(--accent);color:var(--on-accent)}
.move-btn:active{transform:scale(.96)}
.rows li:first-child{border-top:0}
.why{display:flex;align-items:center;gap:10px;min-width:0;font-weight:600}
.why i{flex:none;width:8px;height:8px;border-radius:50%}

/* ---------- simulated data + model ---------- */
function weather(code, dateStr) {
  const ap0 = AIRPORTS[code], mo = +dateStr.slice(5, 7), north = ap0.lat > 18;
  const sea = north ? ({10:.8, 11:.6, 12:.5, 1:.5}[mo] || 1) : ({10:1, 11:1.1, 12:1.15, 1:1.05}[mo] || 1);

  return Array.from({length:24}, (_, h) => {
    const g = Math.exp(-((h - 17) ** 2) / 18);
    const p = Math.min(.97, Math.max(.03, ap.rain + ap.storm*g*df*.85 + (r()-.5)*.08));
    const gust = Math.round(13 + 30*g*df + r()*6);
    return {h, p, gust, storm: p > .55 && gust > 32};

const wxAt = (wx, min) => wx[Math.min(23, Math.max(0, Math.round(min/60)))];
const wxLerp = (wx, h) => { const a = Math.floor(h) % 24, b = (a + 1) % 24, t = h - Math.floor(h); return wx[a].p * (1 - t) + wx[b].p * t; };

  const A = AIRPORTS[s.from], air = AIRLINES[airline];
  const wxA = weather(s.from, dateStr), wxB = weather(s.to, dateStr);
  const dw = wxAt(wxA, dep), aw = wxAt(wxB, dep + dur);
  const terms = {
    depWx: 1.6 * Math.max(0, dw.p - .25) * (dw.storm ? 1.25 : 1),
    arrWx: 1.8 * Math.max(0, aw.p - .25) * (aw.storm ? 1.25 : 1),
    peak: .7 * A.hub * sl.peak * (holidayOn(dateStr) ? 1.3 : 1),
    knock: sl.knock,
    airline: Math.max(0, air.d),
  };
  const z = -3.1 + Object.values(terms).reduce((a,b)=>a+b, 0) + Math.min(0, air.d);
  return {wxA, wxB, dw, aw, terms, z, p: sig(z)};
}

const HOLIDAYS = [
  {from:'2026-11-06', to:'2026-11-09', label:'Deepavali', f:1.35},
  {from:'2026-12-19', to:'2027-01-03', label:'Year-end holidays', f:1.22},
  {from:'2026-12-23', to:'2026-12-26', label:'Christmas', f:1.4},
  {from:'2026-12-30', to:'2027-01-02', label:'New Year', f:1.38},

const holidayOn = dateStr => HOLIDAYS.filter(x => dateStr >= x.from && dateStr <= x.to).sort((a, b) => b.f - a.f)[0] || null;
const DOW = [1.12, .97, .9, .92, 1.0, 1.15, 1.04];  // Sun..Sat: Fri and Sun busiest, Tue/Wed cheapest
function dateMult(s, dateStr, airline, slotKey) {
  const [y, mo, d] = dateStr.split('-').map(Number), dt = new Date(y, mo - 1, d), hol = holidayOn(dateStr);
  const r = rng(hash(airline + s.from + s.to + dateStr + slotKey)), budget = AIRLINES[airline].f <= 1.05;

  if (!hol && r() < (budget ? .16 : .06)) { m *= budget ? .7 : .85; promo = true; }   // seat sale on this flight

// airlines that fly this route: a fixed set per route, plus yours if it's not in it

  pool.sort((a, b) => hash(key + a) - hash(key + b));

/* ---------- tracker: dot-matrix map, arc, plane ---------- */
let trk = null;
function initTracker(m) {
  const map = $('#trkMap'), cv = $('#trkCanvas'), A = AIRPORTS[m.s.from], B = AIRPORTS[m.s.to];
  const W = map.clientWidth, H = map.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);

  const spanLon = Math.max(14, lonMax - lonMin + 10), spanLat = Math.max(8, latMax - latMin + 7);
  const sc = Math.min(W / spanLon, (H - 70) / spanLat);
  const cx = (lonMin + lonMax) / 2, cy = (latMin + latMax) / 2;
  const proj = (lon, lat) => [W/2 + (lon - cx) * sc, 34 + (H - 34)/2 - (lat - cy) * sc];
  const unproj = (x, y) => [cx + (x - W/2) / sc, cy - (y - 34 - (H - 34)/2) / sc];
  const off = document.createElement('canvas'); off.width = cv.width; off.height = cv.height;
  const o = off.getContext('2d'); o.setTransform(dpr, 0, 0, dpr, 0, 0);
  o.fillStyle = css('--trk-dot') || '#7cc4ff';
  const step = W < 600 ? 7 : 8;

    const [lon, lat] = unproj(x, y);

  }

    x = Math.max(10, Math.min(W - w - 10, x));
    if (y < (W < 600 ? 104 : 62)) y = P[1] + 14;
    y = Math.max(10, Math.min(H - h - 10, y));

    const c = (t - t0) % CYCLE;
    if (c < FLY) drawTrk(ease(c / FLY), t, 1, 0);

function drawTrk(p, now = 0, dir = 1, turn = 0) {

    const v = cur.fare(s.days - i), w = Math.min(.22, .04 + .005 * i);
    ahead.push({i, v, lo: Math.round(v * (1 - w)), hi: Math.round(v * (1 + w))});
  }
  return {past, ahead};
}

function drawPrice(el, W, note, leg) {
  const {s, cur} = model, {past, ahead} = fareSeries(s, cur), H = 250, L = 46, R = 18, T = 26, B = 28;
  const i0 = -30, i1 = Math.max(s.days, 1);
  const all = [...past.map(p => p.v), ...ahead.map(p => p.hi), ...ahead.map(p => p.lo), s.price];
  const lo = Math.min(...all) * .94, hi = Math.max(...all) * 1.04;
  const step = niceStep((hi - lo) / 4), y0 = Math.floor(lo/step)*step, y1 = Math.ceil(hi/step)*step;
  const x = i => L + (i - i0) / (i1 - i0) * (W - L - R), y = v => T + (1 - (v - y0)/(y1 - y0)) * (H - T - B);
  const line = arr => arr.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const stepLine = arr => arr.map((p, k) => k ? `H${x(p.i).toFixed(1)}V${y(p.v).toFixed(1)}` : `M${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const band = line(ahead.map(p => ({i:p.i, v:p.hi}))) + ahead.slice().reverse().map(p => `L${x(p.i).toFixed(1)},${y(p.lo).toFixed(1)}`).join('') + 'Z';
  const bestPt = ahead.reduce((a, b) => b.v < a.v ? b : a, ahead[0]);
  let g = '';
  for (let v = y0; v <= y1 + 1e-6; v += step) g += `<line class="c-grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="c-axis" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const ticks = [i0, -15, 0, ...(s.days > 24 ? [Math.round(s.days / 2)] : []), s.days].filter((t, k, a) => a.indexOf(t) === k);
  ticks.forEach(t => g += `<text class="c-axis" x="${x(t)}" y="${H-8}" text-anchor="${t === s.days && t !== 0 ? 'end' : t === i0 ? 'start' : 'middle'}">${t === 0 ? 'Today' : t === s.days ? 'Fly' : fmtDate(addDays(TODAY, t))}</text>`);
  const tx = x(0), sy = y(s.price), bx = x(bestPt.i), byy = y(bestPt.v), lbl = bestPt.i === 0 ? 'Best: today' : `Best: ${fmtDate(addDays(TODAY, bestPt.i))}`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Past fares and forecast to departure">
    ${g}
    <path class="c-band" d="${band}"/>
    <path class="c-obs" d="${stepLine(past)}"/>
    <path class="c-fc" d="${line(ahead)}"/>
    <line class="c-today" x1="${tx}" x2="${tx}" y1="${T-6}" y2="${H-B}"/>
    <circle class="c-best" cx="${bx}" cy="${byy}" r="5"/>
    <text class="c-best-lab" x="${bx + (bx > W * .7 ? -9 : 9)}" y="${byy + 18}" text-anchor="${bx > W * .7 ? 'end' : 'start'}">${lbl}</text>
    <circle class="c-you" cx="${tx}" cy="${sy}" r="6"/>
    <text class="c-lab" x="${tx - 10}" y="${sy - 10}" text-anchor="end">You: RM ${s.price}</text>
    <line class="c-hair" id="hair" y1="${T}" y2="${H-B}" visibility="hidden"/><circle class="c-dot" id="dot" r="5" visibility="hidden"/>
    <rect class="c-hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/>
  </svg>`;
  note.textContent = model.rise > 0 ? 'Rising' : 'Flat';
  leg.innerHTML = `<span><i class="sw" style="background:var(--ink-2)"></i>Past</span><span><i class="sw dash"></i>Forecast</span><span><i class="sw" style="background:var(--accent-soft)"></i>Range</span><span><i class="sw" style="background:var(--good)"></i>Best day</span>`;
  const tip = tipEl(el), hair = el.querySelector('#hair'), dot = el.querySelector('#dot'), pts = [...past, ...ahead];
  el.querySelector('.c-hit').addEventListener('pointermove', e => {
    const r = el.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const i = Math.max(i0, Math.min(s.days, Math.round(i0 + (px - L) / (W - L - R) * (i1 - i0)))), p = pts.find(q => q.i === i); if (!p) return;
    hair.setAttribute('x1', x(i)); hair.setAttribute('x2', x(i)); hair.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(p.v)); dot.setAttribute('visibility', 'visible');
    tip.innerHTML = `${fmtDate(addDays(TODAY, i))} · RM ${p.v}${p.lo ? ` <span>(${p.lo}–${p.hi})</span>` : ' <span>· past</span>'}`;
    place(tip, el, W, H, x(i), y(p.v));
  });
  el.querySelector('.c-hit').addEventListener('pointerleave', () => { tip.hidden = true; hair.setAttribute('visibility','hidden'); dot.setAttribute('visibility','hidden'); });
}

function drawDelays(el, W, note, leg) {
  const hist = model.hist.slice(-histWeeks), H = 240, L = 40, R = 10, T = 16, B = 28;
  const max = Math.max(60, Math.ceil(Math.max(...hist.map(h => h.cancelled ? 0 : h.mins)) / 30) * 30);
  const bw = (W - L - R) / hist.length, y = v => T + (1 - v / max) * (H - T - B), base = y(0);
  let g = '';
  for (let v = 0; v <= max; v += 30) g += `<line class="c-grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="c-axis" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}m</text>`;
  const every = Math.ceil(hist.length / (W < 560 ? 5 : 8));
  hist.forEach((h, i) => {
    const w = Math.max(3, bw * .62), bx = L + i*bw + (bw - w) / 2, val = h.cancelled ? max : Math.max(2, h.mins), top = y(val), rr = Math.min(4, w/2);
    const cls = h.cancelled ? 'c-cxl' : h.late ? `c-${h.cause}` : 'c-bar';
    g += `<path class="${cls}" d="M${bx},${base} V${top+rr} Q${bx},${top} ${bx+rr},${top} H${bx+w-rr} Q${bx+w},${top} ${bx+w},${top+rr} V${base}Z"/>`;
    if (h.cancelled) g += `<text class="c-cxl-lab" x="${bx + w/2}" y="${top + 13}" text-anchor="middle">✕</text>`;
    if ((hist.length - 1 - i) % every === 0) g += `<text class="c-axis" x="${bx + w/2}" y="${H-8}" text-anchor="middle">${fmtDate(h.day)}</text>`;
    g += `<rect class="c-hit" data-i="${i}" x="${L + i*bw}" y="${T}" width="${bw}" height="${H-T-B}"/>`;
  });
  g += `<line class="c-thr" x1="${L}" x2="${W-R}" y1="${y(30)}" y2="${y(30)}"/><text class="c-thr-lab" x="${W-R}" y="${y(30)-6}" text-anchor="end">Late (30m+)</text>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Delay minutes for this flight, last ${histWeeks} weeks">${g}</svg>`;
  const lateN = hist.filter(h => h.late).length, cx = hist.filter(h => h.cancelled).length;
  const avg = Math.round(hist.filter(h => !h.cancelled).reduce((a, h) => a + h.mins, 0) / Math.max(1, hist.filter(h => !h.cancelled).length));
  note.textContent = `Late ${lateN}/${hist.length} · Avg ${avg} min${cx ? ` · ${cx} cancelled` : ''}`;
  leg.innerHTML = ['wx','busy','late','ops'].map(k => `<span><i class="sw" style="background:var(--c-${k})"></i>${CAUSE[k]}</span>`).join('') + `<span><i class="sw" style="background:var(--bar)"></i>On time</span><span><i class="sw" style="background:var(--ink-3)"></i>Cancelled</span>`;
  const tip = tipEl(el);
  el.querySelectorAll('.c-hit').forEach(r => {
    r.addEventListener('pointerenter', () => { const i = +r.dataset.i, h = hist[i];
      tip.innerHTML = `${fmtDate(h.day)} · ${h.cancelled ? 'Cancelled' : `+${h.mins} min`}${h.late && !h.cancelled ? ` <span>· ${CAUSE[h.cause]}</span>` : ''}`;
      place(tip, el, W, H, L + i*bw + bw/2, y(h.cancelled ? max : Math.max(2, h.mins))); });
    r.addEventListener('pointerleave', () => tip.hidden = true);
  });
}

// ---------- weather tab: one card per airport + 7-day outlook ----------
const WX_ICON = {
  sunny: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
  cloudy: '<path d="M8.5 6.6A3.5 3.5 0 0 1 14.6 6"/><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.2 10.1 3.95 3.95 0 0 0 7 18z"/>',
  showers: '<path d="M7.5 4.5v1.2M3.8 8.2H5M4.9 5.3l.9.9"/><path d="M6.4 9.3a3 3 0 0 1 4.3-2.6"/><path d="M8 15h9a3.6 3.6 0 0 0 .4-7.2A5.4 5.4 0 0 0 7.3 7.7 3.7 3.7 0 0 0 8 15z"/><path d="M10 18l-.8 2M14 18l-.8 2"/>',
  heavy: '<path d="M7 14h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.2 6.1 3.95 3.95 0 0 0 7 14z"/><path d="M8 17l-1.2 3M12 17l-1.2 3M16 17l-1.2 3"/>',
  storm: '<path d="M7 14h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.2 6.1 3.95 3.95 0 0 0 7 14z"/><path d="M12.5 15.5 10.5 19h3l-2 3.5"/>',
};
const wxIcon = (k, cls = '') => `<svg class="wxi ${cls}" viewBox="0 0 24 24" aria-hidden="true">${WX_ICON[k]}</svg>`;
function dayWx(code, dateStr) {
  const w = weather(code, dateStr), pmax = Math.max(...w.map(x => x.p)), storm = w.filter(x => x.storm).length >= 5 && pmax > .9;
  const a = AIRPORTS[code], mo = +dateStr.slice(5, 7), r = rng(hash('t' + code + dateStr));
  const north = a.lat > 12 ? (a.lat - 12) * .45 + (a.lat > 18 ? ({11:3, 12:6, 1:7}[mo] || 0) : 0) : 0;
  const hi = Math.round(32.6 + (r() - .5) * 2.4 - north - pmax * 1.5), lo = Math.round(25 + (r() - .5) * 1.6 - north * 1.1);
  const kind = storm ? 'storm' : pmax > .8 ? 'heavy' : pmax > .62 ? 'showers' : pmax > .42 ? 'cloudy' : 'sunny';
  return {w, pmax: Math.min(.9, pmax), hi, lo, kind, label: {storm:'Thunderstorms', heavy:'Heavy rain', showers:'Some showers', cloudy:'Cloudy', sunny:'Mostly sunny'}[kind]};
}
const hourKind = x => x.storm && x.p > .75 ? 'storm' : x.p > .75 ? 'heavy' : x.p > .55 ? 'showers' : x.p > .35 ? 'cloudy' : 'sunny';
function drawWeatherTab(el, note, leg) {
  const {s, cur} = model;
  const ends = [
    {code:s.from, when:cur.dep, lab:'at take-off', c:cur.contrib.depWx, at:cur.dw},
    {code:s.to, when:cur.arr, lab:'at landing', c:cur.contrib.arrWx, at:cur.aw},
  ];
  const cards = ends.map(e => {
    const d = dayWx(e.code, s.date), st = e.c < .03 ? ['good', 'Calm skies · on time likely'] : e.c < .1 ? ['warn', 'A bit rough · small delay chance'] : ['bad', 'Stormy · delays likely'];
    const h0 = Math.min(20, Math.max(0, Math.round(e.when / 60) - 3));
    const hours = d.w.slice(h0, h0 + 7).map(x => {
      const t = Math.round(d.lo + (d.hi - d.lo) * Math.exp(-((x.h - 14) ** 2) / 20) - x.p * 1.5), mine = x.h === Math.min(23, Math.round(e.when / 60));
      return `<div class="wxh${mine ? ' on' : ''}"><span>${String(x.h).padStart(2, '0')}:00</span>${wxIcon(hourKind(x), 'sm')}<b>${t}°</b><span>${pct(x.p)}</span><span>${x.gust}</span></div>`;
    }).join('');
    return `<article class="wxc">
      <div class="wxc-top">${wxIcon(d.kind, 'lg')}<div class="wxc-name"><b>${AIRPORTS[e.code].name}</b><span>${d.label}</span></div><div class="wxc-t"><b>${d.hi}°</b><span>${d.lo}° low</span></div></div>
      <div class="wxc-status ${st[0]}">${st[1]}</div>
      <div class="wxc-chips"><span>Wind <b>${e.at.gust} km/h</b></span><span>Rain <b>${pct(e.at.p)}</b></span><span>${e.lab} ${hhmm(e.when)}</span></div>
      <button type="button" class="wxc-more" aria-expanded="false">Show the numbers</button>
      <div class="wxc-hours" hidden><div class="wxh head"><span>Time</span><span></span><b>Temp</b><span>Rain</span><span>km/h</span></div>${hours}</div>
    </article>`;
  }).join('');
  const strip = code => {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const dt = addDays(s.dt, i); if (dt > addDays(TODAY, 90)) break;
      const v = iso(dt), d = dayWx(code, v);
      days.push(`<button type="button" class="wxd${i === 0 ? ' on' : ''}" data-date="${v}" aria-label="${dt.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'short'})}: ${d.label}, ${d.hi}°, ${pct(d.pmax)} rain">
        <span class="wd">${dt.toLocaleDateString('en-GB', {weekday:'short'}).toUpperCase()}</span>${wxIcon(d.kind)}<b>${d.hi}°</b><span class="lo">${d.lo}°</span><span class="rp">${pct(d.pmax)} rain</span></button>`);
    }
    return `<section class="wxs"><p class="wxs-h">${AIRPORTS[code].name} · 7-day forecast</p><div class="wxs-row">${days.join('')}</div></section>`;
  };
  el.innerHTML = `<div class="wxt"><div class="wxt-grid">${cards}</div><div class="wxt-grid">${strip(s.from)}${strip(s.to)}</div></div>`;
  note.textContent = 'Simulated forecast';
  leg.innerHTML = '<span>Tap a day to check that date</span>';
  el.querySelectorAll('.wxc-more').forEach(b => b.addEventListener('click', () => {
    const box = b.nextElementSibling, open = box.hidden; box.hidden = !open;
    b.setAttribute('aria-expanded', open); b.textContent = open ? 'Hide the numbers' : 'Show the numbers';
  }));
  el.querySelectorAll('.wxd:not(.on)').forEach(b => b.addEventListener('click', () => {
    $('#date').value = b.dataset.date; $('#dateVal').textContent = new Date(b.dataset.date + 'T00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
    update({resetPrice: true});
    requestAnimationFrame(() => $('#chart')?.scrollIntoView({block:'center'}));
  }));
}

// delay chance by weekday and departure hour, averaged over the next 3 weeks
function drawBest(el, W, note, leg) {
  const {s, cur} = model, hours = [6, 8, 10, 12, 14, 16, 18, 20, 22], days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const cell = (wd, hr) => {
    let sum = 0;
    for (let w = 0; w < 3; w++) {
      let d = addDays(TODAY, 1 + 7 * w); while ((d.getDay() + 6) % 7 !== wd) d = addDays(d, 1);
      const sl = {dep: hr * 60, peak: (hr >= 7 && hr <= 9) || (hr >= 17 && hr <= 20) ? 1 : .6, knock: Math.max(0, (hr - 6) / 16 * .8) + (wd === 4 || wd === 6 ? .15 : 0)};
      sum += delayModel(s, sl, iso(d), cur.dur, s.airline, hr * 60).p;
    }
    return sum / 3;
  };
  const grid = days.map((_, wd) => hours.map(hr => cell(wd, hr)));
  const flat = grid.flat(), mn = Math.min(...flat), mx = Math.max(...flat);
  let bestC = [0, 0]; grid.forEach((row, a) => row.forEach((v, b) => { if (v < grid[bestC[0]][bestC[1]]) bestC = [a, b]; }));
  const myRow = (s.dt.getDay() + 6) % 7, myCol = hours.reduce((bi, hr, k) => Math.abs(hr * 60 - cur.dep) < Math.abs(hours[bi] * 60 - cur.dep) ? k : bi, 0);
  const L = 40, T = 22, gap = 3, cw = (W - L) / hours.length, ch = 30, H = T + days.length * ch + 8;
  let g = hours.map((hr, k) => `<text class="c-axis" x="${L + k*cw + cw/2}" y="${T - 8}" text-anchor="middle">${String(hr).padStart(2,'0')}:00</text>`).join('');
  grid.forEach((row, a) => {
    g += `<text class="c-axis" x="${L - 8}" y="${T + a*ch + ch/2 + 4}" text-anchor="end">${days[a]}</text>`;
    row.forEach((v, b) => {
      const t = (v - mn) / Math.max(.001, mx - mn), op = .1 + t * .85, cx = L + b*cw + gap/2, cy = T + a*ch + gap/2;
      g += `<rect class="c-heat" x="${cx}" y="${cy}" width="${cw - gap}" height="${ch - gap}" rx="5" style="fill-opacity:${op.toFixed(2)}"/>`;
      if (cw > 34) g += `<text class="c-heat-lab${op > .55 ? ' on' : ''}" x="${cx + (cw-gap)/2}" y="${cy + (ch-gap)/2 + 4}" text-anchor="middle">${Math.round(v*100)}</text>`;
      if (a === myRow && b === myCol) g += `<rect class="c-heat-you" x="${cx}" y="${cy}" width="${cw - gap}" height="${ch - gap}" rx="5"/>`;
      if (a === bestC[0] && b === bestC[1]) g += `<rect class="c-heat-best" x="${cx}" y="${cy}" width="${cw - gap}" height="${ch - gap}" rx="5"/>`;
      g += `<rect class="c-hit" data-a="${a}" data-b="${b}" x="${cx}" y="${cy}" width="${cw - gap}" height="${ch - gap}"/>`;
    });
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Delay chance by day and departure time">${g}</svg>`;
  note.textContent = `Best: ${days[bestC[0]]} ${String(hours[bestC[1]]).padStart(2,'0')}:00`;
  leg.innerHTML = `<span><i class="sw heat-lo"></i>Low delay</span><span><i class="sw heat-hi"></i>High delay</span><span><i class="sw ring-you"></i>Yours</span><span><i class="sw ring-best"></i>Best</span>`;
  const tip = tipEl(el);
  el.querySelectorAll('.c-hit').forEach(r => {
    r.addEventListener('pointerenter', () => { const a = +r.dataset.a, b = +r.dataset.b;
      tip.innerHTML = `${days[a]} ${String(hours[b]).padStart(2,'0')}:00 · <b>${Math.round(grid[a][b]*100)}%</b> <span>delay chance</span>`;
      place(tip, el, W, H, L + b*cw + cw/2, T + a*ch); });
    r.addEventListener('pointerleave', () => tip.hidden = true);
  });
}

/* ---------- wiring ---------- */
function update(opts = {}) {
  const s = readState(), err = $('#err');
  const msg = s.from === s.to ? 'Pick two different airports.' : !s.date || isNaN(s.days) ? 'Pick a date.' : s.days < 0 ? 'Pick a date from today.' : s.days > 90 ? 'Pick a date within 3 months.' : '';
  err.hidden = !msg; err.textContent = msg;
  if (msg) return;
  if (trk) cancelAnimationFrame(trk.raf);
  if (wx) cancelAnimationFrame(wx.raf);
  showAll = false;
  if (opts.resetPrice) { s.price = evalFlight(s, s.slot).fare(s.days); $('#price').value = s.price; }
  model = build(s); render(model);
}
$('#ask').addEventListener('submit', e => { e.preventDefault(); update(); });
['#from','#to','#date','#airline'].forEach(id => $(id).addEventListener('change', () => update({resetPrice: true})));
let pt; $('#price').addEventListener('input', () => { clearTimeout(pt); pt = setTimeout(update, 350); });
$('#swap').addEventListener('click', e => {
  const a = $('#from').value; $('#from').value = $('#to').value; $('#to').value = a;
  $('#from').sync(); $('#to').sync(); e.currentTarget.classList.toggle('spin'); update({resetPrice: true});
});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  if (!model) return; drawChart(); syncTabs(); initTracker(model);
  const keep = wx ? {h: wx.hour, on: wx.playing} : null; initRadar(model);
  if (keep) { wx.hour = keep.h; $('#wxHour').value = keep.h; setPlaying(keep.on); drawRadar(); }
}, 150); });
update();
})();
</script>
