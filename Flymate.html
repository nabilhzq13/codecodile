<title>Flymate</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>
/* Flymate design system
   Layout: one column, 1080px measure. Answer first (verdict as a type-led hero), then the decision (why + flights),
   then the money (cost table + backtest), then the media panels (live map, weather map), then the detail charts.
   Sections are separated by space and one hairline, not by cards. Only media panels and real controls get a radius. */
:root{
  /* colour */
  --bg:#ffffff; --bg-alt:#f5f5f7; --raised:#ffffff;
  --ink:#1d1d1f; --ink-2:#515154; --ink-3:#6e6e73; --line:#d2d2d7; --line-soft:#e8e8ed;
  --accent:#0066cc; --accent-hover:#0058b0; --accent-soft:#e8f1fb; --on-accent:#ffffff;
  --good:#1a7f37; --good-bg:#e8f5ec; --warn:#a14b00; --warn-bg:#fdf1e3; --bad:#c42b1c; --bad-bg:#fcebe9;
  --c-wx:#3478f6; --c-busy:#c27c0e; --c-late:#8e5bd8; --c-ops:#6e6e73; --bar:#c7c7cc;
  /* media panels keep one dark look in both themes */
  --media:#111214; --media-2:rgba(255,255,255,.07); --media-line:rgba(255,255,255,.12); --media-ink:#f5f5f7; --media-ink-2:#a1a1a6;
  --trk-bg:var(--media); --trk-panel:var(--media-2); --trk-border:var(--media-line); --trk-ink:var(--media-ink); --trk-ink-2:var(--media-ink-2);
  --trk-dot:#8a96a6; --trk-a:#2997ff; --trk-b:#2997ff; --trk-c:#2997ff; --trk-good:#30d158; --trk-warn:#ffb340; --trk-bad:#ff6961;
  /* legacy names still read by the script */
  --glass:var(--bg); --glass-2:var(--bg-alt); --border:var(--line); --tip:var(--raised); --shadow:rgba(0,0,0,.12);
  /* type */
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --mono:var(--f);
  --t-cap:12px; --t-small:14px; --t-body:17px; --t-lead:21px; --t-h3:24px; --t-h2:32px; --t-hero:clamp(40px,6.4vw,64px);
  /* space: 4 8 12 16 24 32 48 64 96 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px;
  --r-control:10px; --r-media:20px; --pop:0 12px 32px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.06);
  --ease:cubic-bezier(.25,.1,.25,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --bg-alt:#161617; --raised:#1d1d1f;
  --ink:#f5f5f7; --ink-2:#a1a1a6; --ink-3:#86868b; --line:#424245; --line-soft:#2c2c2e;
  --accent:#2997ff; --accent-hover:#47a6ff; --accent-soft:rgba(41,151,255,.15); --on-accent:#ffffff;
  --good:#30d158; --good-bg:rgba(48,209,88,.13); --warn:#ffb340; --warn-bg:rgba(255,179,64,.13); --bad:#ff6961; --bad-bg:rgba(255,105,97,.13);
  --c-wx:#64a8ff; --c-busy:#ffb340; --c-late:#bf9bff; --c-ops:#98989d; --bar:#48484a;
  --media:#161617; --pop:0 12px 32px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --bg-alt:#161617; --raised:#1d1d1f;
  --ink:#f5f5f7; --ink-2:#a1a1a6; --ink-3:#86868b; --line:#424245; --line-soft:#2c2c2e;
  --accent:#2997ff; --accent-hover:#47a6ff; --accent-soft:rgba(41,151,255,.15); --on-accent:#ffffff;
  --good:#30d158; --good-bg:rgba(48,209,88,.13); --warn:#ffb340; --warn-bg:rgba(255,179,64,.13); --bad:#ff6961; --bad-bg:rgba(255,105,97,.13);
  --c-wx:#64a8ff; --c-busy:#ffb340; --c-late:#bf9bff; --c-ops:#98989d; --bar:#48484a;
  --media:#161617; --pop:0 12px 32px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:var(--t-body);line-height:1.47;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
.bgfx{display:none}
.wrap{max-width:1080px;margin:0 auto;padding-inline:var(--s5);padding-block:var(--s4) var(--s8);display:flex;flex-direction:column}
@media (max-width:600px){.wrap{padding-inline:var(--s4)}}
button,input,select{font:inherit;letter-spacing:inherit}
button:focus-visible,.ctl:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.card{background:none;border:0;border-radius:0;box-shadow:none}
.num,.val,.proof-big,.km,.wx-time,.rc-line b,.rc-total b,.dpp,.wxh,.c-axis{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{display:flex;align-items:center;height:52px;border-bottom:1px solid var(--line-soft);margin-bottom:var(--s6)}
.brand{display:flex;align-items:center;gap:var(--s2);font-family:var(--f-display);font-size:var(--t-lead);font-weight:600;letter-spacing:-.02em}
.brand svg{width:20px;height:20px;fill:var(--ink);transform:rotate(45deg)}

/* ---------- query bar: one grouped control, labels above fields ---------- */
.search{position:relative;z-index:20;display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--s3);padding:var(--s4);background:var(--bg-alt);border-radius:16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 140px;position:relative}
.f.wide{flex:2 1 260px}
.f.seg-f{flex:2 1 270px}
.f > label,.f > .lab{font-size:var(--t-cap);font-weight:600;color:var(--ink-3);padding-left:2px}
.ctl{font-size:var(--t-small);font-weight:500;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:var(--r-control);padding:0 var(--s3);min-height:44px;width:100%;transition:border-color .15s var(--ease)}
.ctl:hover{border-color:var(--ink-3)}
.ctl:focus,.ctl:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pair{display:flex;align-items:center;gap:var(--s2)}
.pair .dd{flex:1 1 0;min-width:0}
.swap{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--raised);color:var(--ink-2);cursor:pointer;font-size:14px;transition:transform .3s var(--ease)}
.swap.spin{transform:rotate(180deg)}
.price{position:relative}
.price span{position:absolute;left:var(--s3);top:50%;transform:translateY(-50%);font-size:var(--t-small);color:var(--ink-3);pointer-events:none}
.price input{padding-left:40px;padding-right:34px;-moz-appearance:textfield}
.price input::-webkit-outer-spin-button,.price input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.price .chev{position:absolute;right:14px;top:50%;margin-top:-5px;pointer-events:none}
.btn{font-size:var(--t-small);font-weight:600;padding:0 var(--s5);min-height:44px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;flex:0 0 auto;transition:background-color .15s var(--ease)}
.btn:hover{background:var(--accent-hover)}
.err{color:var(--bad);font-weight:600;font-size:var(--t-small);margin:var(--s3) 0 0}

/* dropdowns and popovers: the only elevated surfaces */
.dd{position:relative}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);text-align:left;cursor:pointer}
.dd-btn .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn .v small{font-size:var(--t-cap);color:var(--ink-3);margin-left:6px;font-weight:400}
.chev{flex:none;width:8px;height:8px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:translateY(-2px) rotate(45deg);transition:transform .2s var(--ease)}
.dd.open .chev{transform:translateY(2px) rotate(225deg)}
.dd.open .dd-btn,.price-dd.open .ctl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dd-list{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:max(100%,220px);max-height:min(360px,60vh);overflow:auto;margin:0;padding:6px;list-style:none;
  background:var(--raised);border-radius:12px;box-shadow:var(--pop);scrollbar-width:none;
  opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s var(--ease),transform .2s var(--ease),visibility 0s linear .2s}
.dd-list::-webkit-scrollbar{display:none}
.dd.open .dd-list{opacity:1;visibility:visible;transform:none;transition:opacity .15s var(--ease),transform .2s var(--ease),visibility 0s}
.dd-list li{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:var(--t-small)}
.dd-list li small{color:var(--ink-3)}
.dd-list li.active{background:var(--bg-alt)}
.dd-list li[aria-selected="true"]{color:var(--accent);font-weight:600}
.price-dd .dd-list{min-width:max(100%,240px)}
.pair > .dd:last-child .dd-list{left:auto;right:0}
@media (max-width:600px){.dd-list{max-width:calc(100vw - 32px)}}
.price-dd .dd-head{font-size:var(--t-cap);color:var(--ink-3);padding:6px 10px 4px;cursor:default}

/* calendar */
.dp .dd-btn .ico{flex:none;width:16px;height:16px;fill:none;stroke:var(--ink-3);stroke-width:1.8}
.dp .dd-btn .v{flex:1}
.cal{min-width:316px;max-height:none;overflow:visible;padding:var(--s3)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s2)}
.cal-head b{font-size:var(--t-small);font-weight:600}
.cal-nav{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--accent);font-size:18px;cursor:pointer}
.cal-nav:hover:not(:disabled){background:var(--bg-alt)}
.cal-nav:disabled{color:var(--ink-3);opacity:.4;cursor:default}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-wd span{font-size:11px;font-weight:600;color:var(--ink-3);padding:4px 0}
.cal-grid button{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1;border:0;border-radius:8px;background:transparent;font-size:var(--t-small);color:var(--ink);cursor:pointer}
.cal-grid button:hover:not(:disabled){background:var(--bg-alt)}
.cal-grid button.is-today .dn{color:var(--accent);font-weight:700}
.cal-grid button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.cal-grid button[aria-pressed="true"] .dn{color:var(--on-accent)}
.cal-grid button:disabled{color:var(--ink-3);opacity:.35;cursor:default}
.cal-grid .dpp{font-size:10px;color:var(--ink-3)}
.cal-grid .dpp.lo{color:var(--good)} .cal-grid .dpp.hi{color:var(--bad)}
.cal-grid button[aria-pressed="true"] .dpp{color:var(--on-accent)}
.cal-grid button.is-hol .dn{text-decoration:underline;text-decoration-color:var(--warn);text-decoration-thickness:2px;text-underline-offset:3px}
.cal-grid.slide-l{animation:calL .25s var(--ease)}
.cal-grid.slide-r{animation:calR .25s var(--ease)}
@keyframes calL{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes calR{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.cal-foot{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;margin-top:var(--s2);padding-top:var(--s2);border-top:1px solid var(--line-soft);font-size:11px;color:var(--ink-2)}
.cal-foot span{display:inline-flex;align-items:center;gap:5px}
.cal-foot i{width:7px;height:7px;border-radius:50%}
.cal-foot i.lo{background:var(--good)} .cal-foot i.hi{background:var(--bad)} .cal-foot i.hol{background:var(--warn);border-radius:1px;height:2px;width:12px}
.cal-foot .muted{margin-left:auto;color:var(--ink-3)}

/* segmented control (sliding selection) */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n,3),1fr);padding:2px;min-height:44px;border-radius:var(--r-control);background:var(--line-soft)}
.seg-ind{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/var(--n,3));border-radius:8px;background:var(--raised);border:.5px solid var(--line);
  transform:translateX(calc(var(--i,0) * 100%));transition:transform .3s var(--ease)}
.seg button{position:relative;z-index:1;border:0;background:transparent;color:var(--ink-2);border-radius:8px;cursor:pointer;padding:0 var(--s2);font-size:var(--t-small);font-weight:500}
.seg button[aria-checked="true"]{color:var(--ink);font-weight:600}
.seg.dark{background:rgba(255,255,255,.1)}
.seg.dark .seg-ind{background:rgba(255,255,255,.22);border:0}
.seg.dark button{color:var(--media-ink-2)}
.seg.dark button[aria-checked="true"]{color:#fff}
#wxLayer{min-width:220px}
#sortSeg,#chartOpt .seg{min-height:34px;min-width:230px}
#chartOpt .seg{min-width:140px}
#sortSeg button,#chartOpt .seg button{font-size:13px}

/* ---------- result: sections divided by space and one hairline ---------- */
.stack{display:flex;flex-direction:column;gap:var(--s8);margin-top:var(--s8)}
.stack > .verdict,.stack > .two,.stack > .chart-sec{border-top:1px solid var(--line-soft);padding-top:var(--s7)}
.stack > .verdict{border-top:0;padding-top:0}
.label{margin:0;font-size:var(--t-small);font-weight:500;color:var(--ink-3)}
.panel{padding:0;min-width:0}
.panel h2{font-family:var(--f-display);font-size:var(--t-h3);font-weight:600;letter-spacing:-.02em;margin:0 0 var(--s4)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s8);align-items:start}
.two.money{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
@media (max-width:860px){.two,.two.money{grid-template-columns:minmax(0,1fr);gap:var(--s7)}}

/* verdict: the type-led hero */
.verdict{display:block}
.big{font-family:var(--f-display);font-size:var(--t-hero);font-weight:700;letter-spacing:-.035em;line-height:1.04;margin:var(--s2) 0 var(--s4);color:var(--ink);text-wrap:balance;max-width:16ch}
.sub{margin:0;font-size:var(--t-lead);font-weight:500;line-height:1.35;color:var(--ink-2);max-width:40ch}
.sub.tone-good{color:var(--good)} .sub.tone-warn{color:var(--warn)} .sub.tone-bad{color:var(--bad)}
.flight{margin-top:var(--s3);font-size:var(--t-small);color:var(--ink-3)}
.hol-chip{font-weight:600;color:var(--warn)}
.urg{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);margin-top:var(--s4)}
.urg-chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-small);color:var(--ink-2)}
.urg-chip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.urg-chip b{color:var(--ink);font-weight:600}
.urg-chip.hot,.urg-chip.hot b{color:var(--bad)}
/* three figures read like a spec sheet: big number, plain label, short note */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:var(--s7);border-top:1px solid var(--line-soft)}
.stat{padding:var(--s5) var(--s5) 0 0;min-width:0}
.stat + .stat{padding-left:var(--s5);border-left:1px solid var(--line-soft)}
@media (max-width:600px){.stats{grid-template-columns:minmax(0,1fr)}.stat + .stat{padding-left:0;border-left:0;border-top:1px solid var(--line-soft)}.stat{padding-bottom:var(--s4)}}
.num{font-family:var(--f-display);font-size:48px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:var(--s1) 0 var(--s2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num small{font-size:20px;font-weight:600;margin-right:3px;color:inherit}
.num.tone-good{color:var(--good)} .num.tone-warn{color:var(--warn)} .num.tone-bad{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-small);font-weight:500;color:var(--ink-2);background:none;padding:0;line-height:1.35}
.pill::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.stat .pill{white-space:normal}

/* why: a plain list, each row a cause and its next move */
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-soft)}
.rows li{display:flex;flex-direction:column;gap:var(--s1);padding:var(--s4) 0;border-bottom:1px solid var(--line-soft)}
.why-row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3)}
.why{display:flex;align-items:center;gap:10px;min-width:0;font-weight:600;font-size:var(--t-body)}
.why i{flex:none;width:7px;height:7px;border-radius:50%}
.why i.bad{background:var(--bad)} .why i.warn{background:var(--warn)} .why i.good{background:var(--good)}
.val{font-weight:600;white-space:nowrap}
.val.tone-good{color:var(--good)} .val.tone-warn{color:var(--warn)} .val.tone-bad{color:var(--bad)}
.move{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding-left:17px}
.move-t{font-size:var(--t-small);color:var(--ink-2);min-width:0}
.move-btn{flex:none;border:0;background:none;padding:6px 0;min-height:32px;color:var(--accent);font-size:var(--t-small);font-weight:600;cursor:pointer}
.move-btn:hover{text-decoration:underline;text-underline-offset:3px}

/* flights: a departures list */
.phead{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.phead h2{margin:0}
.opthead,.opt{display:grid;grid-template-columns:minmax(0,1fr) 84px 56px;gap:var(--s3);align-items:center}
.opthead{font-size:var(--t-cap);color:var(--ink-3);padding:0 0 var(--s2);border-bottom:1px solid var(--line-soft)}
.opthead span:nth-child(n+2){text-align:right}
.opt{width:100%;padding:var(--s3) 0;border:0;border-bottom:1px solid var(--line-soft);background:transparent;color:inherit;text-align:left;cursor:pointer}
.opt:hover .w1{color:var(--accent)}
.opt .when{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;min-width:0;font-weight:600;font-size:var(--t-body)}
.opt .w1{white-space:nowrap}
.opt .when .w1 small{font-weight:400;font-size:var(--t-small);color:var(--ink-3);margin-left:6px}
.opt .val{text-align:right}
.opt .val.r{font-weight:500}
.tag{font-size:var(--t-cap);font-weight:600;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.you{background:none;color:var(--ink-3);padding-inline:0}
.tag.sale{background:var(--good-bg);color:var(--good)}
.more{width:100%;margin-top:var(--s3);padding:var(--s2) 0;border:0;background:none;color:var(--accent);font-size:var(--t-small);font-weight:600;cursor:pointer;text-align:left}
.more:hover{text-decoration:underline;text-underline-offset:3px}

/* money row: cost table (narrow) + backtest (wide) */
.proof-h{font-family:var(--f-display);font-size:var(--t-h3);font-weight:600;letter-spacing:-.02em;margin:0 0 var(--s1)}
.proof-ctx{margin:0 0 var(--s5);font-size:var(--t-small);color:var(--ink-3)}
.rc-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5);margin-top:var(--s4)}
.rc-cols.one{grid-template-columns:minmax(0,1fr)}
.rc-col{min-width:0}
.rc-title{margin:0;font-size:var(--t-cap);font-weight:600;color:var(--ink-3)}
.rc-flight{margin:2px 0 var(--s3);font-weight:600;font-size:var(--t-small)}
.rc-line,.rc-total{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);padding:var(--s2) 0;font-size:var(--t-small);color:var(--ink-2);border-top:1px solid var(--line-soft)}
.rc-line small{display:block;font-size:var(--t-cap);color:var(--ink-3)}
.rc-line b{color:var(--ink);font-weight:500}
.rc-total{border-top:1px solid var(--ink);padding-top:var(--s3);color:var(--ink);font-weight:600}
.rc-total b{font-family:var(--f-display);font-size:var(--t-h3);font-weight:600;letter-spacing:-.02em}
.rc-foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin-top:var(--s5);font-size:var(--t-body);font-weight:600}
.rc-foot.good{color:var(--good)} .rc-foot.warn{color:var(--warn)}
.rc-foot .move-btn{color:var(--on-accent);background:var(--accent);border-radius:999px;padding:6px 16px}
.rc-foot .move-btn:hover{background:var(--accent-hover);text-decoration:none}

.legend{display:flex;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s3);font-size:13px;color:var(--ink-2)}

/* ---------- footer, motion ---------- */
.foot{margin:var(--s8) 0 0;padding-top:var(--s4);border-top:1px solid var(--line-soft);font-size:var(--t-cap);color:var(--ink-3)}
.fade{animation:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ================= glass + depth theme, layered over the base system =================
   Vibrant page wash with drifting light → frosted panels with a bright rim and two-step shadow →
   media panels stay dark glass; the live flight renders on a 3D globe. */
:root{
  --page-a:#d9e6fb; --page-b:#ece6fb; --page-c:#dff0f4;
  --orb1:rgba(96,165,250,.55); --orb2:rgba(167,139,250,.45); --orb3:rgba(45,212,191,.32);
  --glass-bg:rgba(255,255,255,.56); --glass-bg-2:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.8);
  --rim-a:rgba(255,255,255,.95); --rim-b:rgba(255,255,255,.45); --deep:rgba(30,50,110,.26);
  --accent-2:#5b4bdb; --raised:rgba(255,255,255,.94);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page-a:#060a15; --page-b:#0c1327; --page-c:#120e24;
  --orb1:rgba(41,151,255,.32); --orb2:rgba(139,92,246,.3); --orb3:rgba(20,184,166,.18);
  --glass-bg:rgba(255,255,255,.055); --glass-bg-2:rgba(255,255,255,.085); --glass-line:rgba(255,255,255,.12);
  --rim-a:rgba(255,255,255,.26); --rim-b:rgba(140,170,255,.16); --deep:rgba(0,0,0,.62);
  --accent-2:#a78bfa; --raised:rgba(30,32,44,.95);
}}
:root[data-theme="dark"]{
  --page-a:#060a15; --page-b:#0c1327; --page-c:#120e24;
  --orb1:rgba(41,151,255,.32); --orb2:rgba(139,92,246,.3); --orb3:rgba(20,184,166,.18);
  --glass-bg:rgba(255,255,255,.055); --glass-bg-2:rgba(255,255,255,.085); --glass-line:rgba(255,255,255,.12);
  --rim-a:rgba(255,255,255,.26); --rim-b:rgba(140,170,255,.16); --deep:rgba(0,0,0,.62);
  --accent-2:#a78bfa; --raised:rgba(30,32,44,.95);
}
html{scroll-behavior:smooth}
body{background-color:var(--page-a);background-image:linear-gradient(160deg,var(--page-a) 0%,var(--page-b) 52%,var(--page-c) 100%);background-attachment:fixed;min-height:100vh}
#verdict,#live,#weather,#charts{scroll-margin-top:90px}

/* drifting light behind the glass */
.bgfx{display:block;position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx .orb{position:absolute;border-radius:50%;filter:blur(70px);animation:drift 30s ease-in-out infinite alternate}
.bgfx .o1{width:42vw;height:42vw;left:-10vw;top:8vh;background:var(--orb1)}
.bgfx .o2{width:34vw;height:34vw;right:-8vw;top:40vh;background:var(--orb2);animation-duration:36s}
.bgfx .o3{width:28vw;height:28vw;left:36vw;top:-8vh;background:var(--orb3);animation-duration:42s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4vw,3vh) scale(1.08)}100%{transform:translate(-3vw,6vh) scale(.95)}}
.wrap{position:relative;z-index:1}

/* glass nav */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:40;height:auto;justify-content:space-between;gap:var(--s3);
  padding:10px 12px 10px 14px;margin-bottom:var(--s5);border:1px solid var(--glass-line);border-radius:18px;background:var(--glass-bg);
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);box-shadow:inset 0 1px 0 var(--rim-a),0 18px 40px -26px var(--deep)}
.brand{gap:10px;font-size:19px}
/* logo: an app-icon tile with a flight path that turns dashed where it becomes a forecast, ending in the plane */
.logo{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;overflow:hidden;
  background:linear-gradient(145deg,var(--accent) 0%,var(--accent-2) 100%);
  box-shadow:0 10px 22px -10px var(--accent),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.18)}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.brand .logo svg{width:24px;height:24px;fill:none;transform:none}
.lg-trail{stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.lg-ahead{stroke:rgba(255,255,255,.85);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:.1 3.1}
.lg-dot{fill:#fff}
.lg-plane{fill:#fff}
/* header: just the logo and links on the page, no bar behind them (not sticky, so text never sits over content) */
.top{position:relative;top:auto;border:0;border-radius:0;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;padding:12px 2px}
.top::after,.search::after{display:none}
.search{box-shadow:0 30px 60px -36px var(--deep),0 10px 26px -18px var(--deep)}
.brand .logo-plane{width:26px;height:26px;fill:url(#logoGrad);transform:rotate(45deg);filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--accent) 40%,transparent))}
.wordmark{font-family:"Manrope",var(--f-display);font-size:21px;font-weight:800;letter-spacing:-.025em;color:var(--ink)}
.nav{display:flex;gap:2px}
.nav a{font-size:var(--t-small);font-weight:500;color:var(--ink-2);text-decoration:none;padding:8px 12px;border-radius:10px;transition:background-color .2s,color .2s}
.nav a:hover{background:var(--glass-bg-2);color:var(--ink)}
.nav a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
@media (max-width:600px){.nav{display:none}}

/* frosted panels */
.search,.stack > .verdict,.stack > .two > .panel,.stack > .chart-sec{position:relative;isolation:isolate;background:var(--glass-bg);border:0;
  -webkit-backdrop-filter:blur(24px) saturate(165%);backdrop-filter:blur(24px) saturate(165%);
  box-shadow:inset 0 1px 0 var(--rim-a),0 30px 60px -36px var(--deep),0 10px 26px -18px var(--deep)}
.search{border-radius:22px}
.stack{gap:var(--s5);margin-top:var(--s5)}
.stack > .verdict,.stack > .two,.stack > .chart-sec{border-top:0}
.stack > .verdict,.stack > .chart-sec,.stack > .two > .panel{border-radius:26px;padding:var(--s6)}
.stack > .two{padding-top:0;gap:var(--s5)}
@media (max-width:600px){.stack > .verdict,.stack > .chart-sec,.stack > .two > .panel{padding:var(--s5);border-radius:22px}}
.search::after,.stack > .verdict::after,.stack > .two > .panel::after,.stack > .chart-sec::after,.trk::after,.wx::after,.top::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:4;
  background:linear-gradient(140deg,var(--rim-a),transparent 34%,transparent 66%,var(--rim-b));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.top{position:sticky}

/* ---------- helpers ---------- */
const hash = str => { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const rng = seed => { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const sig = z => 1 / (1 + Math.exp(-z));
const pct = p => Math.round(p * 100) + '%';
const fmtDate = d => d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

const spaced = n => Math.round(n).toLocaleString('en-US').replace(/,/g, ' ');
const hav = (a, b) => { const R = 6371, r = Math.PI/180, dLat = (b.lat-a.lat)*r, dLon = (b.lon-a.lon)*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const curve = d => { d = Math.max(0, d); if (d >= 18) return d > 50 ? 1 + (d-50)*.004 : 1; return 1 + .022 * Math.pow(18 - d, 1.2); };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- animated dropdown ---------- */
function enhance(sel, view) {
  const wrap = document.createElement('div'); wrap.className = 'dd';
  const id = sel.id + '-list';
  wrap.innerHTML = `<button type="button" class="ctl dd-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="${id}" aria-label="${sel.getAttribute('aria-label')}"><span class="v"></span><i class="chev" aria-hidden="true"></i></button><ul class="dd-list" role="listbox" id="${id}" tabindex="-1"></ul>`;
  sel.after(wrap); sel.hidden = true;
  const btn = wrap.querySelector('button'), list = wrap.querySelector('ul'), vals = [...sel.options].map(o => o.value);
  list.innerHTML = vals.map(v => `<li role="option" data-v="${v}">${view(v, true)}</li>`).join('');
  const items = [...list.children];
  let act = 0;
  const sync = () => { btn.querySelector('.v').innerHTML = view(sel.value, false); items.forEach(li => li.setAttribute('aria-selected', li.dataset.v === sel.value)); };
  const setAct = i => { act = (i + items.length) % items.length; items.forEach((li, j) => li.classList.toggle('active', j === act)); items[act].scrollIntoView({block:'nearest'}); };
  const open = () => { document.querySelectorAll('.dd.open').forEach(d => d !== wrap && d.close()); wrap.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); setAct(vals.indexOf(sel.value)); };
  const close = () => { wrap.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); };
  const pick = v => { close(); if (sel.value !== v) { sel.value = v; sync(); sel.dispatchEvent(new Event('change')); } btn.focus(); };
  wrap.close = close; sel.sync = sync;
  btn.addEventListener('click', () => wrap.classList.contains('open') ? close() : open());
  btn.addEventListener('keydown', e => {
    const isOpen = wrap.classList.contains('open');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!isOpen) open(); else setAct(act + (e.key === 'ArrowDown' ? 1 : -1)); }
    else if ((e.key === 'Enter' || e.key === ' ') && isOpen) { e.preventDefault(); pick(items[act].dataset.v); }
    else if (e.key === 'Escape' || e.key === 'Tab') close();
  });
  items.forEach((li, j) => { li.addEventListener('mouseenter', () => setAct(j)); li.addEventListener('click', () => pick(li.dataset.v)); });
  sync();
}
document.addEventListener('click', e => { if (!e.target.closest('.dd')) document.querySelectorAll('.dd.open').forEach(d => d.close()); });
const apView = (k, long) => long ? `<span>${k}</span><small>${AIRPORTS[k].name}</small>` : `${k}<small>${AIRPORTS[k].name}</small>`;

/* ---------- segmented control (sliding highlight) ---------- */
function makeSeg(el, options, value, onChange, dark) {
  el.classList.add('seg'); if (dark) el.classList.add('dark');
  el.setAttribute('role', 'radiogroup'); el.style.setProperty('--n', options.length);
  el.innerHTML = '<span class="seg-ind" aria-hidden="true"></span>' + options.map(o => `<button type="button" role="radio" data-k="${o.k}">${o.label}</button>`).join('');
  const btns = [...el.querySelectorAll('button')];
  const set = (k, fire) => {
    const i = Math.max(0, options.findIndex(o => o.k === k));
    el.style.setProperty('--i', i);
    btns.forEach((b, j) => { b.setAttribute('aria-checked', j === i); b.tabIndex = j === i ? 0 : -1; });
    if (fire) onChange(options[i].k);
  };
  btns.forEach((b, j) => {
    b.addEventListener('click', () => set(b.dataset.k, true));
    b.addEventListener('keydown', e => {
      if (!['ArrowLeft','ArrowRight'].includes(e.key)) return;
      e.preventDefault(); const n = (j + (e.key === 'ArrowRight' ? 1 : -1) + options.length) % options.length;
      set(options[n].k, true); btns[n].focus();
    });
  });
  set(value, false);
  return {set};
}
const slotKeys = Object.keys(SLOTS);
const segDep = makeSeg($('#seg'), slotKeys.map(k => ({k, label:SLOTS[k].label})), 'evening', k => { $('#slot').value = k; update({resetPrice: true}); });

/* ---------- animated calendar picker ---------- */
function datePicker(input) {
  const MIN = TODAY, MAX = addDays(TODAY, 90);
  const wrap = document.createElement('div'); wrap.className = 'dd dp';
  wrap.innerHTML = `<button type="button" class="ctl dd-btn" aria-haspopup="dialog" aria-expanded="false" aria-labelledby="dateLab dateVal">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="v" id="dateVal"></span><i class="chev" aria-hidden="true"></i></button>
    <div class="dd-list cal" role="dialog" aria-label="Choose a date">
      <div class="cal-head"><button type="button" class="cal-nav" data-d="-1" aria-label="Previous month">‹</button><b aria-live="polite"></b><button type="button" class="cal-nav" data-d="1" aria-label="Next month">›</button></div>
      <div class="cal-wd">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d => `<span>${d}</span>`).join('')}</div>
      <div class="cal-grid"></div>
      <div class="cal-foot"><span><i class="lo"></i>Cheap</span><span><i class="hi"></i>Pricey</span><span><i class="hol"></i>Holiday</span><span class="muted">Lowest RM / day</span></div>
    </div>`;
  input.after(wrap);
  const btn = wrap.querySelector('.dd-btn'), panel = wrap.querySelector('.cal'), head = wrap.querySelector('.cal-head b'), grid = wrap.querySelector('.cal-grid'), navs = wrap.querySelectorAll('.cal-nav');
  const parse = v => { const [y, m, d] = v.split('-').map(Number); return new Date(y, m-1, d); };
  const monthOf = d => new Date(d.getFullYear(), d.getMonth(), 1);
  let view = monthOf(parse(input.value));
  const sync = () => { btn.querySelector('.v').textContent = parse(input.value).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}); };
  const draw = dir => {
    head.textContent = view.toLocaleDateString('en-GB', {month:'long', year:'numeric'});
    const y = view.getFullYear(), mo = view.getMonth(), first = (view.getDay() + 6) % 7, n = new Date(y, mo + 1, 0).getDate();
    let h = '<span></span>'.repeat(first);
    const st = {from:$('#from').value, to:$('#to').value, airline:$('#airline').value};
    const all = []; for (let k = 0; k <= 90; k++) all.push(cheapestOn(st, iso(addDays(TODAY, k)), k));
    const sorted = all.slice().sort((a, b) => a - b), p33 = sorted[30], p66 = sorted[60];
    for (let d = 1; d <= n; d++) {
      const dt = new Date(y, mo, d), v = iso(dt), off = dt < MIN || dt > MAX, k = Math.round((dt - TODAY) / 86400000);
      const pr = off ? null : all[k], cls = pr == null ? '' : pr <= p33 ? 'lo' : pr >= p66 ? 'hi' : 'mid', hol = holidayOn(v);
      h += `<button type="button" data-v="${v}"${off ? ' disabled' : ''} aria-pressed="${v === input.value}" class="${v === iso(TODAY) ? 'is-today' : ''}${hol ? ' is-hol' : ''}" aria-label="${dt.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'})}${pr ? `, from RM ${pr}` : ''}${hol ? `, ${hol.label}` : ''}"><span class="dn">${d}</span>${pr ? `<span class="dpp ${cls}">${pr}</span>` : ''}</button>`;
    }
    grid.innerHTML = h;
    navs[0].disabled = view <= monthOf(MIN); navs[1].disabled = view >= monthOf(MAX);
    if (dir) { grid.classList.remove('slide-l', 'slide-r'); void grid.offsetWidth; grid.classList.add(dir > 0 ? 'slide-l' : 'slide-r'); }
  };
  const focusDay = v => (grid.querySelector(`[data-v="${v}"]:not(:disabled)`) || grid.querySelector('button:not(:disabled)'))?.focus({preventScroll:true});
  const open = () => {
    document.querySelectorAll('.dd.open').forEach(d => d !== wrap && d.close());
    view = monthOf(parse(input.value)); draw();
    wrap.classList.add('open'); btn.setAttribute('aria-expanded', 'true');
    setTimeout(() => focusDay(input.value), 80);
  };
  const close = () => { wrap.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); };
  wrap.close = close;
  btn.addEventListener('click', () => wrap.classList.contains('open') ? close() : open());
  panel.addEventListener('click', e => e.stopPropagation());
  navs.forEach(b => b.addEventListener('click', () => { const d = +b.dataset.d; view = new Date(view.getFullYear(), view.getMonth() + d, 1); draw(d); }));
  grid.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const changed = input.value !== b.dataset.v;
    input.value = b.dataset.v; sync(); draw();
    setTimeout(() => { close(); btn.focus(); }, 180);
    if (changed) input.dispatchEvent(new Event('change'));
  });
  grid.addEventListener('keydown', e => {
    const step = {ArrowLeft:-1, ArrowRight:1, ArrowUp:-7, ArrowDown:7}[e.key]; if (!step) return;
    e.preventDefault();
    const curV = document.activeElement?.dataset?.v; if (!curV) return;
    const next = addDays(parse(curV), step); if (next < MIN || next > MAX) return;
    const nm = monthOf(next); if (+nm !== +view) { const dir = nm > view ? 1 : -1; view = nm; draw(dir); }
    focusDay(iso(next));
  });
  wrap.addEventListener('keydown', e => { if (e.key === 'Escape' && wrap.classList.contains('open')) { close(); btn.focus(); } });
  sync();
}
datePicker($('#date'));

/* ---------- price picker: typed value or a pick from prices sorted low to high ---------- */
(function pricePicker() {
  const input = $('#price'), wrap = input.closest('.price-dd'), list = $('#priceList');
  let items = [], act = -1;
  const build = () => {
    const fair = model ? model.fair : 380;
    const vals = [...new Set([.65, .75, .85, .92, 1, 1.08, 1.15, 1.3, 1.5].map(k => Math.max(30, Math.round(fair * k / 5) * 5)))].sort((a, b) => a - b);
    list.innerHTML = '<li class="dd-head" aria-hidden="true">Low to high</li>' + vals.map(v => {
      const r = v / fair, c = r > 1.08 ? 'bad' : r < .92 ? 'good' : 'warn', w = r > 1.08 ? 'Too high' : r < .92 ? 'Good deal' : 'Fair';
      return `<li role="option" data-v="${v}" aria-selected="${String(v) === input.value}"><span>RM ${v}</span><span class="pill ${c}">${w}</span></li>`;
    }).join('');
    items = [...list.querySelectorAll('[role="option"]')];
    items.forEach((li, j) => { li.addEventListener('mouseenter', () => setAct(j)); li.addEventListener('click', () => pick(li.dataset.v)); });
  };
  const setAct = i => { act = (i + items.length) % items.length; items.forEach((li, j) => li.classList.toggle('active', j === act)); items[act].scrollIntoView({block:'nearest'}); };
  const open = () => {
    if (wrap.classList.contains('open')) return;
    document.querySelectorAll('.dd.open').forEach(d => d !== wrap && d.close());
    build(); act = -1; wrap.classList.add('open'); input.setAttribute('aria-expanded', 'true');
  };
  const close = () => { wrap.classList.remove('open'); input.setAttribute('aria-expanded', 'false'); };
  const pick = v => { input.value = v; close(); update(); };

function drawFlights() {
  const {s, flights, best} = model;
  const key = {best: f => f.total, price: f => f.price, delay: f => f.p}[flightSort];
  const list = flights.slice().sort((a, b) => key(a) - key(b));
  const shown = showAll ? list : list.slice(0, 5);
  const box = $('#flightRows');
  box.innerHTML = shown.map(f => {
    const yours = f.slotKey === s.slot && f.airline === s.airline;
    const dc = f.p >= .45 ? 'bad' : f.p >= .2 ? 'warn' : 'good';
    return `<button type="button" class="opt" data-slot="${f.slotKey}" data-air="${f.airline}" data-price="${f.price}">
      <span class="when"><span class="w1">${hhmm(f.dep)} <small>${AIRLINES[f.airline].name}</small></span>${f === best ? '<span class="tag">Best</span>' : ''}${f.promo ? '<span class="tag sale">Sale</span>' : ''}${yours ? '<span class="tag you">Yours</span>' : ''}</span>
      <span class="val">RM ${f.price}</span>
      <span class="val r tone-${dc}">${pct(f.p)}</span></button>`;
  }).join('') + (list.length > 5 ? `<button type="button" class="more" id="moreBtn">${showAll ? 'Show less' : `Show all ${list.length}`}</button>` : '');
  box.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    $('#slot').value = b.dataset.slot; segDep.set(b.dataset.slot);
    $('#airline').value = b.dataset.air; $('#airline').sync(); $('#price').value = b.dataset.price; update();
  }));
  $('#moreBtn')?.addEventListener('click', () => { showAll = !showAll; drawFlights(); });
}

function syncTabs() {
  const btns = [...document.querySelectorAll('[data-tab]')], ind = document.querySelector('.tab-ind');
  btns.forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  const b = btns.find(x => x.dataset.tab === tab);
  if (b && ind) { ind.style.width = b.offsetWidth + 'px'; ind.style.transform = `translateX(${b.offsetLeft}px)`; }
}

  ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = '600 11px "Plus Jakarta Sans", system-ui, sans-serif'; ctx.textBaseline = 'middle';
  for (const p of wx.ports) {

      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill();
      ctx.font = '700 12px "Plus Jakarta Sans", system-ui, sans-serif';

      ctx.fillStyle = 'rgba(8,13,30,.82)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bxx, byy - 11, tw + 16, 22, 7) : ctx.rect(bxx, byy - 11, tw + 16, 22); ctx.fill();

// the plane follows the clock: parked before takeoff, flying the route, parked after landing
function drawRadarPlane(A, B, h) {
  const {ctx, m, planeImg} = wx, c = m.cur, t = Math.min(1, Math.max(0, (h * 60 - c.dep) / c.dur));
  const x = A[0] + (B[0] - A[0]) * t, y = A[1] + (B[1] - A[1]) * t, ang = Math.atan2(B[1] - A[1], B[0] - A[0]);
  const flying = t > 0 && t < 1;
  if (t > 0) {  // flown part of the route, with a glowing contrail near the plane
    const g = ctx.createLinearGradient(A[0], A[1], x, y); g.addColorStop(0, 'rgba(41,151,255,.5)'); g.addColorStop(1, 'rgba(41,151,255,.95)');
    ctx.save(); ctx.strokeStyle = g; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.shadowColor = 'rgba(200,230,255,.8)'; ctx.shadowBlur = flying ? 10 : 0;
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(x, y); ctx.stroke(); ctx.restore();
  }
  if (!flying) {  // waiting at the gate or landed: soft pulse
    const pulse = (performance.now() % 1600) / 1600;
    ctx.strokeStyle = `rgba(41,151,255,${(.7 * (1 - pulse)).toFixed(2)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 14 + pulse * 14, 0, 7); ctx.stroke();
  }
  if (planeImg.complete && planeImg.naturalWidth) {
    const size = (flying ? 40 : 30) * (wx.W < 600 ? .85 : 1);
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang + Math.PI / 2 + (flying ? Math.sin(performance.now() / 1300) * .05 : 0));
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 6;
    ctx.drawImage(planeImg, -size / 2, -size / 2, size, size); ctx.restore();
  }
  if (flying) {  // what the plane is flying through right now
    const [lo, la] = wx.unproj(x, y), txt = `${c.flightNo} · ${RAMPS[wxLayer].unit(valueAt(lo, la, h, isLand(lo, la) ? 1 : 0)).split(' · ')[0]}`;
    ctx.font = '700 12px "Plus Jakarta Sans", system-ui, sans-serif'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(txt).width, bx = Math.min(wx.W - tw - 20, Math.max(4, x - tw / 2 - 8)), by = Math.min(wx.H - 14, y + 30);
    ctx.fillStyle = 'rgba(41,151,255,.9)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, by - 11, tw + 16, 22, 11) : ctx.rect(bx, by - 11, tw + 16, 22); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(txt, bx + 8, by);
  }
}

/* ---------- charts ---------- */
const niceStep = raw => { const p = 10 ** Math.floor(Math.log10(raw)), n = raw / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; };

function drawChart() {
  if (!model) return;

  if (!el) return;
  const W = Math.max(280, el.clientWidth);
  optBox.innerHTML = '';

    drawDelays(el, W, note, leg);

}

// past fares move in steps (fare buckets) with the odd flash sale; the future is a forecast with a widening range
function fareSeries(s, cur) {
  const r = rng(hash(cur.flightNo + s.date + 'fares')), past = [], ahead = [];
  let mult = 1, left = 0;
  for (let i = -30; i < 0; i++) {
    if (left <= 0) { left = 2 + Math.floor(r() * 5); mult = 1 + (r() - .5) * .16; if (r() < .1) mult *= .74; }
    left--;
    past.push({i, v: Math.round(cur.fare(s.days - i) * mult)});
  }
  for (let i = 0; i <= s.days; i++) {
    const v = cur.fare(s.days - i), w = Math.min(.22, .04 + .005 * i);
    ahead.push({i, v, lo: Math.round(v * (1 - w)), hi: Math.round(v * (1 + w))});
  }
  return {past, ahead};
}

function drawPrice(el, W, note, leg) {

  const lo = Math.min(...all) * .94, hi = Math.max(...all) * 1.04;
  const step = niceStep((hi - lo) / 4), y0 = Math.floor(lo/step)*step, y1 = Math.ceil(hi/step)*step;

  const stepLine = arr => arr.map((p, k) => k ? `H${x(p.i).toFixed(1)}V${y(p.v).toFixed(1)}` : `M${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const band = line(ahead.map(p => ({i:p.i, v:p.hi}))) + ahead.slice().reverse().map(p => `L${x(p.i).toFixed(1)},${y(p.lo).toFixed(1)}`).join('') + 'Z';
  const bestPt = ahead.reduce((a, b) => b.v < a.v ? b : a, ahead[0]);
  let g = '';
  for (let v = y0; v <= y1 + 1e-6; v += step) g += `<line class="c-grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="c-axis" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const ticks = [i0, -15, 0, ...(s.days > 24 ? [Math.round(s.days / 2)] : []), s.days].filter((t, k, a) => a.indexOf(t) === k);
  ticks.forEach(t => g += `<text class="c-axis" x="${x(t)}" y="${H-8}" text-anchor="${t === s.days && t !== 0 ? 'end' : t === i0 ? 'start' : 'middle'}">${t === 0 ? 'Today' : t === s.days ? 'Fly' : fmtDate(addDays(TODAY, t))}</text>`);
  const tx = x(0), sy = y(s.price), bx = x(bestPt.i), byy = y(bestPt.v), lbl = bestPt.i === 0 ? 'Best: today' : `Best: ${fmtDate(addDays(TODAY, bestPt.i))}`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Past fares and forecast to departure">
    ${g}
    <path class="c-band" d="${band}"/>
    <path class="c-obs" d="${stepLine(past)}"/>
    <path class="c-fc" d="${line(ahead)}"/>
    <line class="c-today" x1="${tx}" x2="${tx}" y1="${T-6}" y2="${H-B}"/>
    <circle class="c-best" cx="${bx}" cy="${byy}" r="5"/>
    <text class="c-best-lab" x="${bx + (bx > W * .7 ? -9 : 9)}" y="${byy + 18}" text-anchor="${bx > W * .7 ? 'end' : 'start'}">${lbl}</text>
    <circle class="c-you" cx="${tx}" cy="${sy}" r="6"/>
    <text class="c-lab" x="${tx - 10}" y="${sy - 10}" text-anchor="end">You: RM ${s.price}</text>
    <line class="c-hair" id="hair" y1="${T}" y2="${H-B}" visibility="hidden"/><circle class="c-dot" id="dot" r="5" visibility="hidden"/>
    <rect class="c-hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/>

    place(tip, el, W, H, x(i), y(p.v));

function drawDelays(el, W, note, leg) {

  const every = Math.ceil(hist.length / (W < 560 ? 5 : 8));

    if (h.cancelled) g += `<text class="c-cxl-lab" x="${bx + w/2}" y="${top + 13}" text-anchor="middle">✕</text>`;

// ---------- weather tab: one card per airport + 7-day outlook ----------
const WX_ICON = {

  storm: '<path d="M7 14h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.2 6.1 3.95 3.95 0 0 0 7 14z"/><path d="M12.5 15.5 10.5 19h3l-2 3.5"/>',
};
const wxIcon = (k, cls = '') => `<svg class="wxi ${cls}" viewBox="0 0 24 24" aria-hidden="true">${WX_ICON[k]}</svg>`;
function dayWx(code, dateStr) {
  const w = weather(code, dateStr), pmax = Math.max(...w.map(x => x.p)), storm = w.filter(x => x.storm).length >= 5 && pmax > .9;
  const a = AIRPORTS[code], mo = +dateStr.slice(5, 7), r = rng(hash('t' + code + dateStr));
  const north = a.lat > 12 ? (a.lat - 12) * .45 + (a.lat > 18 ? ({11:3, 12:6, 1:7}[mo] || 0) : 0) : 0;
  const hi = Math.round(32.6 + (r() - .5) * 2.4 - north - pmax * 1.5), lo = Math.round(25 + (r() - .5) * 1.6 - north * 1.1);

const hourKind = x => x.storm && x.p > .75 ? 'storm' : x.p > .75 ? 'heavy' : x.p > .55 ? 'showers' : x.p > .35 ? 'cloudy' : 'sunny';

      const t = Math.round(d.lo + (d.hi - d.lo) * Math.exp(-((x.h - 14) ** 2) / 20) - x.p * 1.5), mine = x.h === Math.min(23, Math.round(e.when / 60));

    }

  note.textContent = 'Simulated forecast';

    $('#date').value = b.dataset.date; $('#dateVal').textContent = new Date(b.dataset.date + 'T00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
    update({resetPrice: true});
    requestAnimationFrame(() => $('#chart')?.scrollIntoView({block:'center'}));
  }));
}

// delay chance by weekday and departure hour, averaged over the next 3 weeks
function drawBest(el, W, note, leg) {
  const {s, cur} = model, hours = [6, 8, 10, 12, 14, 16, 18, 20, 22], days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const cell = (wd, hr) => {
    let sum = 0;
    for (let w = 0; w < 3; w++) {
      let d = addDays(TODAY, 1 + 7 * w); while ((d.getDay() + 6) % 7 !== wd) d = addDays(d, 1);
      const sl = {dep: hr * 60, peak: (hr >= 7 && hr <= 9) || (hr >= 17 && hr <= 20) ? 1 : .6, knock: Math.max(0, (hr - 6) / 16 * .8) + (wd === 4 || wd === 6 ? .15 : 0)};
      sum += delayModel(s, sl, iso(d), cur.dur, s.airline, hr * 60).p;
    }
    return sum / 3;
  };
  const grid = days.map((_, wd) => hours.map(hr => cell(wd, hr)));
  const flat = grid.flat(), mn = Math.min(...flat), mx = Math.max(...flat);
  let bestC = [0, 0]; grid.forEach((row, a) => row.forEach((v, b) => { if (v < grid[bestC[0]][bestC[1]]) bestC = [a, b]; }));
  const myRow = (s.dt.getDay() + 6) % 7, myCol = hours.reduce((bi, hr, k) => Math.abs(hr * 60 - cur.dep) < Math.abs(hours[bi] * 60 - cur.dep) ? k : bi, 0);
  const L = 40, T = 22, gap = 3, cw = (W - L) / hours.length, ch = 30, H = T + days.length * ch + 8;
  let g = hours.map((hr, k) => `<text class="c-axis" x="${L + k*cw + cw/2}" y="${T - 8}" text-anchor="middle">${String(hr).padStart(2,'0')}:00</text>`).join('');
  grid.forEach((row, a) => {
    g += `<text class="c-axis" x="${L - 8}" y="${T + a*ch + ch/2 + 4}" text-anchor="end">${days[a]}</text>`;
    row.forEach((v, b) => {
      const t = (v - mn) / Math.max(.001, mx - mn), op = .1 + t * .85, cx = L + b*cw + gap/2, cy = T + a*ch + gap/2;
      g += `<rect class="c-heat" x="${cx}" y="${cy}" width="${cw - gap}" height="${ch - gap}" rx="5" style="fill-opacity:${op.toFixed(2)}"/>`;
      if (cw > 34) g += `<text class="c-heat-lab${op > .55 ? ' on' : ''}" x="${cx + (cw-gap)/2}" y="${cy + (ch-gap)/2 + 4}" text-anchor="middle">${Math.round(v*100)}</text>`;
      if (a === myRow && b === myCol) g += `<rect class="c-heat-you" x="${cx}" y="${cy}" width="${cw - gap}" height="${ch - gap}" rx="5"/>`;
      if (a === bestC[0] && b === bestC[1]) g += `<rect class="c-heat-best" x="${cx}" y="${cy}" width="${cw - gap}" height="${ch - gap}" rx="5"/>`;
      g += `<rect class="c-hit" data-a="${a}" data-b="${b}" x="${cx}" y="${cy}" width="${cw - gap}" height="${ch - gap}"/>`;
    });
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Delay chance by day and departure time">${g}</svg>`;
  note.textContent = `Best: ${days[bestC[0]]} ${String(hours[bestC[1]]).padStart(2,'0')}:00`;
  leg.innerHTML = `<span><i class="sw heat-lo"></i>Low delay</span><span><i class="sw heat-hi"></i>High delay</span><span><i class="sw ring-you"></i>Yours</span><span><i class="sw ring-best"></i>Best</span>`;
  const tip = tipEl(el);
  el.querySelectorAll('.c-hit').forEach(r => {
    r.addEventListener('pointerenter', () => { const a = +r.dataset.a, b = +r.dataset.b;
      tip.innerHTML = `${days[a]} ${String(hours[b]).padStart(2,'0')}:00 · <b>${Math.round(grid[a][b]*100)}%</b> <span>delay chance</span>`;
      place(tip, el, W, H, L + b*cw + cw/2, T + a*ch); });
    r.addEventListener('pointerleave', () => tip.hidden = true);
  });
}

/* ---------- wiring ---------- */
function update(opts = {}) {
  const s = readState(), err = $('#err');
  const msg = s.from === s.to ? 'Pick two different airports.' : !s.date || isNaN(s.days) ? 'Pick a date.' : s.days < 0 ? 'Pick a date from today.' : s.days > 90 ? 'Pick a date within 3 months.' : '';
  err.hidden = !msg; err.textContent = msg;
  if (msg) return;
  if (trk) cancelAnimationFrame(trk.raf);
  if (g3) cancelAnimationFrame(g3.raf);
  if (wx) cancelAnimationFrame(wx.raf);
  showAll = false;
  if (opts.resetPrice) { s.price = evalFlight(s, s.slot).fare(s.days); $('#price').value = s.price; }
  model = build(s); render(model);
}
$('#ask').addEventListener('submit', e => { e.preventDefault(); update(); });
['#from','#to','#date','#airline'].forEach(id => $(id).addEventListener('change', () => update({resetPrice: true})));
let pt; $('#price').addEventListener('input', () => { clearTimeout(pt); pt = setTimeout(update, 350); });
$('#swap').addEventListener('click', e => {
  const a = $('#from').value; $('#from').value = $('#to').value; $('#to').value = a;
  $('#from').sync(); $('#to').sync(); e.currentTarget.classList.toggle('spin'); update({resetPrice: true});
});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  if (!model) return; drawChart(); syncTabs(); initTrack(model);
  const keep = wx ? {h: wx.hour, on: wx.playing} : null; initRadar(model);
  if (keep) { wx.hour = keep.h; $('#wxHour').value = keep.h; setPlaying(keep.on); drawRadar(); }
}, 150); });
update();
})();
</script>
